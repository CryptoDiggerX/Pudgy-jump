<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pudgy Jump</title>
  <meta name="description" content="Pudgy Jump — Base-powered jump mini game." />
  <meta name="fc:miniapp" content='{"version":"1","imageUrl":"https://pudgy-jump.vercel.app/icon.png","button":{"title":"Play Pudgy Jump","action":{"type":"launch_miniapp"}},"splashImageUrl":"https://pudgy-jump.vercel.app/icon.png","splashBackgroundColor":"#08172b","homeUrl":"https://pudgy-jump.vercel.app"}' />

  <!-- Farcaster SDK loaded as a normal script tag (no dynamic import) -->
  <script src="https://esm.sh/@farcaster/miniapp-sdk@0.0.28/dist/index.umd.js" onerror="window.__sdkFailed=true"></script>

  <style>
    :root{--bg1:#071427;--bg2:#0c2f57;--card:#0c3761ee;--cardBorder:#7da7c9aa;--accent:#9f4dff;--accent2:#c86bff;--text:#fff;--muted:#c9dbf4;--success:#52f7a7;--shadow:0 18px 50px rgba(0,0,0,.38);}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:system-ui,sans-serif;background:radial-gradient(circle at top,#19538a 0%,var(--bg2) 35%,var(--bg1) 100%);color:var(--text);overflow:hidden;}
    button{font:inherit}
    .app{position:relative;height:100%;width:100%;display:flex;align-items:center;justify-content:center;padding:18px;}
    .blur-bg{position:absolute;inset:0;background:linear-gradient(rgba(7,20,39,.4),rgba(7,20,39,.6));filter:blur(10px);transform:scale(1.08);}
    .top-title{position:absolute;top:14px;left:0;right:0;text-align:center;font-weight:800;font-size:18px;text-shadow:0 2px 8px rgba(0,0,0,.4);z-index:2;}
    .modal{position:relative;z-index:2;width:min(92vw,420px);background:var(--card);border:1px solid var(--cardBorder);border-radius:22px;padding:22px 18px 18px;box-shadow:var(--shadow);backdrop-filter:blur(18px);}
    .pill{display:inline-block;background:#3e89ff;color:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800;margin:0 auto 10px;}
    .center{text-align:center}
    h1{margin:0 0 8px;font-size:30px;line-height:1.05;letter-spacing:.4px}
    p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
    .fee-box{margin:18px 0 14px;background:#061a33;border:1px solid rgba(125,167,201,.35);border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;font-size:13px;}
    .fee-box strong{color:var(--success);font-size:14px}
    .toggle{display:flex;gap:10px;margin:0 0 14px}
    .toggle button{flex:1;border:none;border-radius:14px;padding:12px 10px;background:#0a2443;color:#dbe8f8;font-weight:700;cursor:pointer;}
    .toggle button.active{background:#153a67;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);}
    .start{width:100%;border:none;border-radius:16px;padding:14px 16px;background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 10px 24px rgba(159,77,255,.35);}
    .start:disabled{opacity:.55;cursor:not-allowed}
    .hint{margin-top:10px;font-size:12px;color:#bfd0e7;text-align:center}
    .bottom-nav{position:absolute;z-index:2;left:50%;transform:translateX(-50%);bottom:16px;width:min(92vw,480px);background:rgba(17,52,90,.72);border:1px solid rgba(145,179,215,.35);border-radius:18px;padding:8px;display:flex;gap:6px;backdrop-filter:blur(14px);}
    .tab{flex:1;text-align:center;padding:10px 0;border-radius:14px;font-size:12px;font-weight:700;color:#e6efff;background:transparent;user-select:none;cursor:pointer;}
    .tab.active{background:linear-gradient(180deg,#b05cff,#7a3cff)}
    .game-overlay{display:none;position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:16px;}
    .game-card{width:min(92vw,420px);background:#0b2446;border:1px solid rgba(125,167,201,.35);border-radius:22px;padding:22px;box-shadow:var(--shadow);text-align:center;}
    .game-card h2{margin:0 0 6px;font-size:22px}
    .score-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;color:var(--muted);}
    .score-val{font-weight:800;color:#fff;font-size:15px}
    .game-area{height:200px;border-radius:18px;background:linear-gradient(180deg,#173b6b,#081a35);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.1);cursor:pointer;}
    .ground{position:absolute;bottom:0;left:0;right:0;height:22px;background:linear-gradient(180deg,#1a4a7a,#0f2d52);border-top:1px solid rgba(255,255,255,.1);}
    .runner{position:absolute;left:34px;bottom:22px;width:32px;height:32px;border-radius:10px;background:linear-gradient(180deg,#ffd86b,#ff9f2d);}
    .runner.dead{background:linear-gradient(180deg,#ff6b6b,#ff2d2d)}
    .jump{animation:jump .5s ease-out}
    @keyframes jump{0%{transform:translateY(0)}45%{transform:translateY(-76px)}100%{transform:translateY(0)}}
    .game-over-msg{display:none;position:absolute;inset:0;background:rgba(0,0,0,.72);border-radius:18px;align-items:center;justify-content:center;flex-direction:column;gap:6px;}
    .game-over-msg h3{margin:0;font-size:20px;color:#ff6b6b}
    .game-over-msg span{font-size:13px;color:var(--muted)}
    .game-footer{display:flex;gap:10px;margin-top:12px}
    .secondary{flex:1;border:none;border-radius:14px;padding:12px;background:#17365e;color:#fff;font-weight:800;cursor:pointer;}
    .primary{flex:1;border:none;border-radius:14px;padding:12px;background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;font-weight:900;cursor:pointer;}
  </style>
</head>
<body>
<div class="app">
  <div class="blur-bg"></div>
  <div class="top-title">Pudgy Jump</div>

  <section class="modal" id="payModal">
    <div class="center">
      <div class="pill">BASE</div>
      <h1>PAY TO PLAY</h1>
      <p>Each run costs <strong style="color:#f7c752">$0.03</strong>, paid in ETH on Base.</p>
    </div>
    <div class="fee-box">
      <span>EST. ETH</span>
      <strong id="feeText">~0.0000100 ETH</strong>
    </div>
    <div class="toggle">
      <button class="active" id="ethBtn" type="button">Base ETH</button>
      <button id="usdcBtn" type="button">USDC</button>
    </div>
    <button class="start" id="startBtn" type="button">PAY $0.03 &amp; START</button>
    <div class="hint" id="hint">Confirm the Base ETH payment in your wallet to start.</div>
  </section>

  <nav class="bottom-nav">
    <div class="tab active">Play</div>
    <div class="tab">Quests</div>
    <div class="tab">Leaderboard</div>
    <div class="tab">Airdrop</div>
    <div class="tab">Invite</div>
    <div class="tab">Shop</div>
  </nav>
</div>

<div class="game-overlay" id="gameOverlay">
  <div class="game-card">
    <h2>Pudgy Jump</h2>
    <div class="score-bar">
      <span>SCORE</span><span class="score-val" id="scoreDisplay">0</span>
      <span>BEST</span><span class="score-val" id="bestDisplay">0</span>
    </div>
    <div class="game-area" id="gameArea">
      <div class="ground"></div>
      <div class="runner" id="runner"></div>
      <div class="game-over-msg" id="gameOverMsg">
        <h3>GAME OVER</h3>
        <span id="finalScore">Score: 0</span>
      </div>
    </div>
    <div class="game-footer">
      <button class="secondary" id="jumpBtn" type="button">&#8679; Jump</button>
      <button class="primary"   id="resetBtn" type="button">&#8635; Restart</button>
    </div>
  </div>
</div>

<script>
(function() {
  "use strict";

  var RECEIVER   = "0x580Aab97021D7D379c8d26444eAae332C3014ba7";
  var BASE_CHAIN = "0x2105";
  var PRICE_WEI  = BigInt("30000000000000");

  // SDK: use window.FarcasterMiniAppSDK if UMD loaded, else null
  function getSDK() {
    try {
      if (window.FarcasterMiniAppSDK && window.FarcasterMiniAppSDK.sdk) return window.FarcasterMiniAppSDK.sdk;
      if (window.sdk && typeof window.sdk.actions === "object") return window.sdk;
    } catch(e) {}
    return null;
  }

  var ethBtn       = document.getElementById("ethBtn");
  var usdcBtn      = document.getElementById("usdcBtn");
  var startBtn     = document.getElementById("startBtn");
  var feeText      = document.getElementById("feeText");
  var hint         = document.getElementById("hint");
  var payModal     = document.getElementById("payModal");
  var gameOverlay  = document.getElementById("gameOverlay");
  var gameArea     = document.getElementById("gameArea");
  var runner       = document.getElementById("runner");
  var jumpBtn      = document.getElementById("jumpBtn");
  var resetBtn     = document.getElementById("resetBtn");
  var scoreDisplay = document.getElementById("scoreDisplay");
  var bestDisplay  = document.getElementById("bestDisplay");
  var gameOverMsg  = document.getElementById("gameOverMsg");
  var finalScore   = document.getElementById("finalScore");

  var payMode     = "eth";
  var paid        = false;
  var best        = parseInt(localStorage.getItem("pj_best") || "0");
  var score       = 0;
  var gameSpeed   = 3;
  var frameCount  = 0;
  var spawnTimer  = 0;
  var coinTimer   = 0;
  var gameRunning = false;
  var isJumping   = false;
  var isDead      = false;
  var obstacles   = [];
  var coins       = [];
  var animFrame   = null;

  bestDisplay.textContent = best;

  // ── Mode toggle ──
  function renderMode() {
    ethBtn.classList.toggle("active", payMode === "eth");
    usdcBtn.classList.toggle("active", payMode === "usdc");
    feeText.textContent = payMode === "eth" ? "~0.0000100 ETH" : "USDC $0.03";
  }
  ethBtn.addEventListener("click",  function() { payMode = "eth";  renderMode(); });
  usdcBtn.addEventListener("click", function() { payMode = "usdc"; renderMode(); });

  // ── Pay ──
  startBtn.addEventListener("click", function() {
    startBtn.disabled = true;
    startBtn.textContent = "PROCESSING...";
    hint.textContent = "Confirm payment in your wallet...";
    doPayment().then(function() {
      paid = true;
      payModal.style.display = "none";
      gameOverlay.style.display = "flex";
      startNewRun();
    }).catch(function(e) {
      startBtn.disabled = false;
      startBtn.textContent = "PAY $0.03 & START";
      hint.textContent = e.code === 4001
        ? "Payment rejected. Try again."
        : "Error: " + (e.message || "Unknown");
    });
  });

  function doPayment() {
    // 1. MetaMask / injected wallet
    if (typeof window.ethereum !== "undefined") {
      return window.ethereum.request({ method: "eth_requestAccounts" })
        .then(function(accounts) {
          var from = accounts[0];
          return window.ethereum.request({
            method: "wallet_switchEthereumChain",
            params: [{ chainId: BASE_CHAIN }]
          }).catch(function(sw) {
            if (sw.code !== 4902) throw sw;
            return window.ethereum.request({
              method: "wallet_addEthereumChain",
              params: [{ chainId: BASE_CHAIN, chainName: "Base",
                nativeCurrency: { name:"Ether", symbol:"ETH", decimals:18 },
                rpcUrls: ["https://mainnet.base.org"],
                blockExplorerUrls: ["https://basescan.org"] }]
            });
          }).then(function() {
            return window.ethereum.request({
              method: "eth_sendTransaction",
              params: [{ from: from, to: RECEIVER,
                value: "0x" + PRICE_WEI.toString(16), chainId: BASE_CHAIN }]
            });
          });
        });
    }

    // 2. Farcaster SDK wallet
    var sdk = getSDK();
    if (sdk) {
      return Promise.resolve(sdk.actions.sendTransaction({
        chainId: "eip155:8453",
        to: RECEIVER,
        value: PRICE_WEI.toString()
      }));
    }

    // 3. No wallet — inform user
    return Promise.reject(new Error("No wallet detected. Open in Warpcast or install MetaMask."));
  }

  // ── Game ──
  function startNewRun() {
    obstacles.forEach(function(o) { o.el.remove(); });
    coins.forEach(function(c) { c.el.remove(); });
    obstacles = []; coins = [];
    score = 0; gameSpeed = 3; frameCount = 0;
    spawnTimer = 0; coinTimer = 0;
    isDead = false; isJumping = false; gameRunning = true;
    runner.className = "runner";
    gameOverMsg.style.display = "none";
    scoreDisplay.textContent = "0";
    if (animFrame) cancelAnimationFrame(animFrame);
    animFrame = requestAnimationFrame(gameLoop);
  }

  function gameLoop() {
    if (!gameRunning) return;
    frameCount++;
    if (frameCount % 200 === 0) gameSpeed = Math.min(gameSpeed + 0.4, 9);
    score++;
    scoreDisplay.textContent = score;

    spawnTimer++;
    if (spawnTimer >= Math.max(55, 100 - frameCount * 0.05)) { spawnTimer = 0; spawnObstacle(); }
    coinTimer++;
    if (coinTimer >= 80) { coinTimer = 0; if (Math.random() > 0.4) spawnCoin(); }

    obstacles = obstacles.filter(function(ob) {
      ob.x -= gameSpeed; ob.el.style.left = ob.x + "px";
      if (ob.x < -30) { ob.el.remove(); return false; } return true;
    });
    coins = coins.filter(function(cn) {
      cn.x -= gameSpeed; cn.el.style.left = cn.x + "px";
      if (cn.x < -25) { cn.el.remove(); return false; } return true;
    });

    var rRect = runner.getBoundingClientRect();
    var aRect = gameArea.getBoundingClientRect();

    for (var i = 0; i < obstacles.length; i++) {
      var ob = obstacles[i];
      var oL = aRect.left + ob.x; var oR = oL + 22;
      var oT = aRect.bottom - 22 - ob.h;
      if (rRect.right-6 > oL+4 && rRect.left+6 < oR-4 &&
          rRect.bottom-4 > oT  && rRect.top+4  < aRect.bottom-22) {
        triggerDeath(); return;
      }
    }

    coins = coins.filter(function(cn) {
      var cL = aRect.left + cn.x; var cT = aRect.top + cn.y;
      if (rRect.right-4 > cL && rRect.left+4 < cL+18 &&
          rRect.bottom-4 > cT && rRect.top+4  < cT+18) {
        score += 10; cn.el.remove(); return false;
      }
      return true;
    });

    animFrame = requestAnimationFrame(gameLoop);
  }

  function spawnObstacle() {
    var el = document.createElement("div");
    var h = 28 + Math.random() * 32;
    var x = gameArea.offsetWidth + 10;
    el.style.cssText = "position:absolute;left:"+x+"px;bottom:22px;width:22px;height:"+h
      +"px;border-radius:8px;background:linear-gradient(180deg,#52f7a7,#16b36f);";
    gameArea.appendChild(el);
    obstacles.push({ el:el, x:x, h:h });
  }

  function spawnCoin() {
    var el = document.createElement("div");
    var x = gameArea.offsetWidth + 10;
    var y = gameArea.offsetHeight - 22 - 55 - Math.random() * 55;
    el.style.cssText = "position:absolute;left:"+x+"px;top:"+y
      +"px;width:16px;height:16px;border-radius:50%;"
      +"background:radial-gradient(circle at 35% 35%,#ffe066,#d4a017);"
      +"border:2px solid rgba(255,255,255,.5);box-shadow:0 0 6px #ffd700aa;";
    gameArea.appendChild(el);
    coins.push({ el:el, x:x, y:y });
  }

  function triggerDeath() {
    gameRunning = false; isDead = true;
    runner.classList.add("dead");
    if (score > best) {
      best = score;
      localStorage.setItem("pj_best", best);
      bestDisplay.textContent = best;
    }
    finalScore.textContent = "Score: " + score
      + (score === best && score > 0 ? "  \uD83C\uDFC6 New Best!" : "");
    gameOverMsg.style.display = "flex";
  }

  function doJump() {
    if (isDead || isJumping) return;
    isJumping = true;
    runner.classList.remove("jump");
    void runner.offsetWidth;
    runner.classList.add("jump");
    setTimeout(function() { isJumping = false; }, 500);
  }

  jumpBtn.addEventListener("click", doJump);
  gameArea.addEventListener("click", doJump);
  document.addEventListener("keydown", function(e) {
    if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); doJump(); }
  });

  resetBtn.addEventListener("click", function() {
    if (paid) { startNewRun(); }
    else { gameOverlay.style.display = "none"; payModal.style.display = ""; }
  });

  // ── SDK ready signal ──
  window.addEventListener("load", function() {
    var sdk = getSDK();
    if (sdk && typeof sdk.actions.ready === "function") {
      sdk.actions.ready().catch(function() {});
    }
  });

  renderMode();
})();
</script>
</body>
</html>
